<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ayan's 11th Birthday Games</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #6c5ce7, #0984e3);
      min-height: 100vh;
      color: #222;
    }

    /*
      HEADER
    */

    .header {
      text-align: center;
      color: white;
      padding: 30px 15px 22px;
    }

    .header h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .header h2 {
      font-size: 24px;
      font-weight: normal;
    }

    .live {
      display: inline-block;
      margin-top: 14px;
      background: #00b894;
      padding: 8px 16px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
    }


    /*
      MAIN CONTAINER
    */

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 15px;
    }


    /*
      CARDS
    */

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);
    }

    .card h2 {
      margin-bottom: 18px;
      color: #2d3436;
    }


    /*
      CURRENT GAME
    */

    .current-game {
      text-align: center;
    }

    .current-game-label {
      color: #636e72;
      font-size: 15px;
      font-weight: bold;
    }

    .game-name {
      font-size: 30px;
      font-weight: bold;
      color: #6c5ce7;
      margin-top: 7px;
    }


    /*
      TABLE
    */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #6c5ce7;
      color: white;
      padding: 13px 10px;
      text-align: center;
      white-space: nowrap;
    }

    td {
      padding: 13px 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    tbody tr:hover {
      background: #f7f7ff;
    }


    /*
      TEAM STANDINGS
    */

    .rank {
      font-size: 22px;
      font-weight: bold;
    }

    .team-name {
      font-weight: bold;
      text-align: left;
    }

    .total {
      color: #6c5ce7;
      font-size: 18px;
      font-weight: bold;
    }

    .gold {
      background: #fff8d6;
    }

    .silver {
      background: #f4f4f4;
    }

    .bronze {
      background: #fff0e1;
    }

      PLAYER DETAILS

      margin-bottom: 28px;
    }
